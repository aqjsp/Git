<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="880" height="300" rx="12" fill="#fafafa"/>
  <rect width="880" height="300" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="440" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">工作区 · 暂存区 · 提交历史：三次快照</text>

  <rect x="40" y="60" width="240" height="180" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">工作区 Working Tree</text>
  <text x="160" y="124" text-anchor="middle" font-size="12" fill="#0d47a1">你看得见、编得了的文件</text>
  <text x="160" y="148" text-anchor="middle" font-size="12" fill="#0d47a1">git diff 看这里 vs 暂存区</text>
  <text x="160" y="188" text-anchor="middle" font-size="12" fill="#1565c0">git add →</text>
  <text x="160" y="212" text-anchor="middle" font-size="11" fill="#546e7a">checkout/restore 可丢改动</text>

  <rect x="320" y="60" width="240" height="180" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="440" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">暂存区 Index</text>
  <text x="440" y="124" text-anchor="middle" font-size="12" fill="#bf360c">下一份 commit 的预览</text>
  <text x="440" y="148" text-anchor="middle" font-size="12" fill="#bf360c">git diff --cached 看这里 vs HEAD</text>
  <text x="440" y="188" text-anchor="middle" font-size="12" fill="#e65100">git commit →</text>
  <text x="440" y="212" text-anchor="middle" font-size="11" fill="#546e7a">reset 把暂存退回</text>

  <rect x="600" y="60" width="240" height="180" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="720" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">仓库 .git/objects</text>
  <text x="720" y="124" text-anchor="middle" font-size="12" fill="#1b5e20">blob / tree / commit</text>
  <text x="720" y="148" text-anchor="middle" font-size="12" fill="#1b5e20">HEAD 指向当前分支尖</text>
  <text x="720" y="188" text-anchor="middle" font-size="12" fill="#2e7d32">git push 同步远程</text>
  <text x="720" y="212" text-anchor="middle" font-size="11" fill="#546e7a">是快照，不是 diff 补丁</text>
  <text x="440" y="274" text-anchor="middle" font-size="12" fill="#78909c">git status 三栏对应这三棵树。detached HEAD 是 HEAD 直接指 commit，不指分支</text>

</svg>
