<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="880" height="300" rx="12" fill="#fafafa"/>
  <rect width="880" height="300" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="440" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">Git 四种对象：blob / tree / commit / tag</text>

  <rect x="30" y="60" width="180" height="160" rx="10" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="120" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">blob</text>
  <text x="120" y="124" text-anchor="middle" font-size="12" fill="#0d47a1">文件内容</text>
  <text x="120" y="148" text-anchor="middle" font-size="12" fill="#0d47a1">不含文件名</text>
  <text x="120" y="180" text-anchor="middle" font-size="11" fill="#546e7a">相同内容只存一份</text>

  <rect x="240" y="60" width="180" height="160" rx="10" fill="#fff3e0" stroke="#e65100"/>
  <text x="330" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">tree</text>
  <text x="330" y="124" text-anchor="middle" font-size="12" fill="#bf360c">目录快照</text>
  <text x="330" y="148" text-anchor="middle" font-size="12" fill="#bf360c">名字 → blob/tree</text>
  <text x="330" y="180" text-anchor="middle" font-size="11" fill="#546e7a">权限 + SHA-1/SHA-256</text>

  <rect x="450" y="60" width="180" height="160" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="540" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">commit</text>
  <text x="540" y="124" text-anchor="middle" font-size="12" fill="#1b5e20">tree + parent(s)</text>
  <text x="540" y="148" text-anchor="middle" font-size="12" fill="#1b5e20">author / message</text>
  <text x="540" y="180" text-anchor="middle" font-size="11" fill="#546e7a">历史是 DAG</text>

  <rect x="660" y="60" width="180" height="160" rx="10" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="750" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">tag</text>
  <text x="750" y="124" text-anchor="middle" font-size="12" fill="#4a148c">指向某个 commit</text>
  <text x="750" y="148" text-anchor="middle" font-size="12" fill="#4a148c">附注标签是对象</text>
  <text x="750" y="180" text-anchor="middle" font-size="11" fill="#546e7a">轻量标签只是引用</text>
  <text x="440" y="260" text-anchor="middle" font-size="12" fill="#78909c">分支是 movable 指针；rebase 是复制 commit 改 parent，原 commit 暂时还在 reflog</text>

</svg>
