<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="340" rx="12" fill="#fafafa"/>
  <rect width="900" height="340" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">merge 保留分叉 vs rebase 变直</text>

  <text x="210" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">git merge</text>
  <circle cx="80" cy="140" r="16" fill="#90caf9"/><text x="80" y="145" text-anchor="middle" font-size="11">A</text>
  <circle cx="160" cy="140" r="16" fill="#90caf9"/><text x="160" y="145" text-anchor="middle" font-size="11">B</text>
  <circle cx="240" cy="100" r="16" fill="#a5d6a7"/><text x="240" y="105" text-anchor="middle" font-size="11">C</text>
  <circle cx="240" cy="180" r="16" fill="#ffcc80"/><text x="240" y="185" text-anchor="middle" font-size="11">D</text>
  <circle cx="320" cy="140" r="16" fill="#ce93d8"/><text x="320" y="145" text-anchor="middle" font-size="11">M</text>
  <line x1="96" y1="140" x2="144" y2="140" stroke="#546e7a"/>
  <line x1="176" y1="140" x2="226" y2="108" stroke="#2e7d32"/>
  <line x1="176" y1="140" x2="226" y2="172" stroke="#e65100"/>
  <line x1="256" y1="100" x2="304" y2="132" stroke="#6a1b9a"/>
  <line x1="256" y1="180" x2="304" y2="148" stroke="#6a1b9a"/>
  <text x="210" y="230" text-anchor="middle" font-size="12" fill="#37474f">M 是合并提交，历史分叉保留</text>
  <text x="210" y="252" text-anchor="middle" font-size="11" fill="#546e7a">适合已经推过的公共分支</text>

  <text x="680" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">git rebase</text>
  <circle cx="520" cy="140" r="16" fill="#90caf9"/><text x="520" y="145" text-anchor="middle" font-size="11">A</text>
  <circle cx="600" cy="140" r="16" fill="#90caf9"/><text x="600" y="145" text-anchor="middle" font-size="11">B</text>
  <circle cx="680" cy="140" r="16" fill="#a5d6a7"/><text x="680" y="145" text-anchor="middle" font-size="11">C</text>
  <circle cx="760" cy="140" r="16" fill="#ffcc80"/><text x="760" y="145" text-anchor="middle" font-size="11">D'</text>
  <line x1="536" y1="140" x2="584" y2="140" stroke="#546e7a"/>
  <line x1="616" y1="140" x2="664" y2="140" stroke="#2e7d32"/>
  <line x1="696" y1="140" x2="744" y2="140" stroke="#e65100"/>
  <text x="680" y="230" text-anchor="middle" font-size="12" fill="#37474f">D 重放到 C 上，变成新哈希 D'</text>
  <text x="680" y="252" text-anchor="middle" font-size="11" fill="#546e7a">只给还没共享的本地分支用</text>
  <text x="450" y="300" text-anchor="middle" font-size="12" fill="#c62828">已经 push 的分支 rebase 后再 push 必须 -f，会改写别人的历史</text>
  <text x="450" y="324" text-anchor="middle" font-size="11" fill="#78909c">冲突时 rebase --continue / --abort。没有 git base 这条命令</text>

</svg>
