<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" font-family="system-ui, -apple-system, sans-serif">
  <rect width="880" height="280" rx="12" fill="#fafafa"/>
  <rect width="880" height="280" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="440" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">reset 三档：--soft / --mixed / --hard</text>

  <text x="80" y="80" font-size="13" fill="#37474f">HEAD</text>
  <text x="280" y="80" font-size="13" fill="#37474f">暂存区</text>
  <text x="500" y="80" font-size="13" fill="#37474f">工作区</text>
  <text x="40" y="124" font-size="13" fill="#1565c0">--soft</text>
  <rect x="140" y="106" width="80" height="28" rx="4" fill="#bbdefb"/><text x="180" y="126" text-anchor="middle" font-size="12">移动</text>
  <rect x="340" y="106" width="80" height="28" rx="4" fill="#c8e6c9"/><text x="380" y="126" text-anchor="middle" font-size="12">不动</text>
  <rect x="560" y="106" width="80" height="28" rx="4" fill="#c8e6c9"/><text x="600" y="126" text-anchor="middle" font-size="12">不动</text>
  <text x="40" y="172" font-size="13" fill="#e65100">--mixed 默认</text>
  <rect x="140" y="154" width="80" height="28" rx="4" fill="#bbdefb"/><text x="180" y="174" text-anchor="middle" font-size="12">移动</text>
  <rect x="340" y="154" width="80" height="28" rx="4" fill="#bbdefb"/><text x="380" y="174" text-anchor="middle" font-size="12">对齐</text>
  <rect x="560" y="154" width="80" height="28" rx="4" fill="#c8e6c9"/><text x="600" y="174" text-anchor="middle" font-size="12">不动</text>
  <text x="40" y="220" font-size="13" fill="#c62828">--hard</text>
  <rect x="140" y="202" width="80" height="28" rx="4" fill="#bbdefb"/><text x="180" y="222" text-anchor="middle" font-size="12">移动</text>
  <rect x="340" y="202" width="80" height="28" rx="4" fill="#bbdefb"/><text x="380" y="222" text-anchor="middle" font-size="12">对齐</text>
  <rect x="560" y="202" width="80" height="28" rx="4" fill="#ef9a9a"/><text x="600" y="222" text-anchor="middle" font-size="12">丢弃</text>
  <text x="440" y="260" text-anchor="middle" font-size="12" fill="#78909c">soft 适合拆 commit；mixed 适合重新 add；hard 不可恢复未提交改动（reflog 救得了 commit）</text>

</svg>
